name: Website doec

on:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Check HTML
        run: test -f index.html

      - name: Check CSS
        run: test -f style.css

      - name: Check JavaScript
        run: test -f script.js
